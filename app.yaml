kind: wasmer.io/App.v0
name: bookly-backend-v1
package: .

# Non-secret config only. Set DB_*, JWT_SECRET, ADMIN_REGISTER_SECRET and
# MAIL_* with `wasmer app secrets create` — never commit them here.
env:
  APP_ENV: production
  DB_DRIVER: pgsql
  DB_SSLMODE: require
  DB_CHANNEL_BINDING: require

scaling:
  mode: single_concurrency
